name: Daily OpEx & GEX Scanner

on:
  schedule:
    # Runs Monday through Friday at 19:45 UTC (3:45 PM EST, 15 min before US market close)
    - cron: '45 19 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub or mobile

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas scipy requests lxml

      - name: Execute Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
