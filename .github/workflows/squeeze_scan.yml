name: Argon Squeeze & 3-Stage Exit Scanner

on:
  schedule:
    # 14:30 UTC (10:30 AM EDT) and 19:45 UTC (3:45 PM EDT) Monday-Friday
    - cron: '30 14 * * 1-5'
    - cron: '45 19 * * 1-5'
  workflow_dispatch: # Allows manual run button anytime

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas scipy requests lxml

      - name: Execute Squeeze Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python argon_squeeze_engine.py
