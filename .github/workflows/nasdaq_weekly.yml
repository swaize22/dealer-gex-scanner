name: Weekly Nasdaq Macro, Bonds, COT & Put-Call Chart

on:
  schedule:
    # Runs every Saturday at 15:10 UTC (10 mins after the Metals chart so they never collide)
    - cron: '10 15 * * 6'
  workflow_dispatch: # Allows manual test runs anytime

permissions:
  contents: write # Commits the growing weekly Forward P/E & ETF Put/Call CSV back into your repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-nasdaq-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance numpy pandas requests plotly lxml

      - name: Run Nasdaq Macro, Bonds & COT Terminal
        run: python nasdaq_macro_terminal.py

      - name: Save Updated Nasdaq Put/Call & Forward P/E History CSV to Repo
        run: |
          if [ -f "nasdaq_pcr_and_pe_history.csv" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add nasdaq_pcr_and_pe_history.csv
            git diff --staged --quiet || (git commit -m "Auto-append weekly Nasdaq Put/Call & Forward P/E data" && git pull --rebase origin main && git push)
          else
            echo "CSV file not generated yet, skipping commit."
          fi

      - name: Upload Interactive HTML Chart to Artifacts (17-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-macro-dashboard
          path: |
            nasdaq_macro_dashboard.html
            nasdaq_pcr_and_pe_history.csv
          retention-days: 17
